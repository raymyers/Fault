name: Rust CI

on:
  push:
    paths:
      - 'fault-rust/**'
  pull_request:
    paths:
      - 'fault-rust/**'

defaults:
  run:
    working-directory: fault-rust

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test
